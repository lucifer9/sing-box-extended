name: RC self-test build

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize builds and publication of the shared rc-test tag and asset names.
concurrency:
  group: rc-test
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the RC branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/rc ]]; then
            echo '::error::Select the rc branch when running this workflow.'
            exit 1
          fi
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - name: Test RC publication logic
        run: node --test .github/publish_rc_test.test.cjs
      - name: Identify build
        id: version
        run: |
          version="0.0.0-rc-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: CLI (${{ matrix.platform }}/${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, goos: linux, arch: amd64, runner: ubuntu-24.04, cgo: '0' }
          - { platform: linux, goos: linux, arch: arm64, runner: ubuntu-24.04-arm, cgo: '0' }
          # - { platform: macos, goos: darwin, arch: amd64, runner: macos-15-intel, cgo: '1' }
          - { platform: macos, goos: darwin, arch: arm64, runner: macos-15, cgo: '0' }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: ${{ matrix.cgo }}
      RC_VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_NAME: sing-box-rc-test-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Build CLI
        run: |
          tags=$(<release/DEFAULT_BUILD_TAGS_RC)
          ldflags=$(<release/LDFLAGS)
          mkdir -p "dist/$PACKAGE_NAME"
          go build -trimpath -tags "$tags" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$RC_VERSION $ldflags -s -w -buildid=" \
            -o "dist/$PACKAGE_NAME/sing-box" ./cmd/sing-box
          cp LICENSE "dist/$PACKAGE_NAME/"
          printf 'Version: %s\nCommit: %s\nTarget: %s/%s\nTags: %s\n' \
            "$RC_VERSION" "$GITHUB_SHA" "$GOOS" "$GOARCH" "$tags" \
            > "dist/$PACKAGE_NAME/BUILD_INFO.txt"
      - name: Smoke-test native CLI
        run: '"dist/$PACKAGE_NAME/sing-box" version'
      - name: Archive CLI
        run: tar -czf "dist/$PACKAGE_NAME.tar.gz" -C dist "$PACKAGE_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Update rc-test downloads
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RC_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sing-box-rc-test-*
          path: dist
          merge-multiple: true
      # Use only GITHUB_TOKEN: its release/tag events do not start the upstream
      # Docker or Linux package publication workflows.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const publish = require('./.github/publish_rc_test.cjs');
            await publish({ github, context, core, version: process.env.RC_VERSION });
